[build]
  publish = "."
  command = "echo 'Static site, no build needed'"

# SPA Fallback for Pilot v2 Routes
[[redirects]]
  from = "/*/international-moving/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/international-moving/*"
  to = "/index.html"
  status = 200

# Global Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
